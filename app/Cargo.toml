[package]
name = "proxzy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-platform local HTTP/1.1 & HTTPS MITM proxy and E2E API scenario engine for desktop browsers, simulators, and physical mobile devices."
repository = "https://github.com/JARNBOY/ProxzyCraft"
keywords = ["proxy", "mitm", "e2e", "mocking", "egui"]
categories = ["development-tools::debugging", "network-programming"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
rcgen = "0.13.2"
rustls = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
rustls-pemfile = "2"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"

[package]
name = "proxzy"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
rcgen = "0.13.2"
rustls = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
rustls-pemfile = "2"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"

[profile.dev]
opt-level = 1

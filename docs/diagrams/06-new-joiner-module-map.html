<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProxzyCraft · Step 3: New-Joiner Layer Map &amp; Fork Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1000px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Build-Up 3 of 3 · Layer Stack · New-Joiner Code Map</p>
    <h1>Step 3: Where every file lives when you fork &amp; extend v1.0.0</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="proxzy-layers-title proxzy-layers-desc">
        <title id="proxzy-layers-title">ProxzyCraft v1.0.0 New-Joiner Layer Map</title>
        <desc id="proxzy-layers-desc">Five architectural layers from desktop UI views and domain models through the async Tokio proxy gate down to the TypeScript SDK and regression CI pipeline.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Direction column (left margin) -->
        <text x="56" y="68" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">DESKTOP UI</text>
        <line x1="80" y1="80" x2="80" y2="400" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <polygon points="76,80 84,80 80,72" fill="#4f5d75"/>
        <text x="52" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CI / RELEASE</text>

        <!-- Outer hairlines -->
        <line x1="120" y1="80" x2="960" y2="80" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <line x1="120" y1="400" x2="960" y2="400" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

        <!-- L5 — Desktop Shell & include! Views -->
        <rect x="120" y="80" width="840" height="64" fill="#ffffff"/>
        <line x1="120" y1="144" x2="960" y2="144" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="140" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L5</text>
        <text x="220" y="118" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Desktop UI &amp; App Shell</text>
        <text x="940" y="118" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">app.rs + include!(views, rules_ui, studio_ui, tour_ui, acp, acp_ui)</text>

        <!-- L4 — Domain, Snippets & Environment Helpers -->
        <rect x="120" y="144" width="840" height="64" fill="#f5f5f5"/>
        <line x1="120" y1="208" x2="960" y2="208" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="140" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L4</text>
        <text x="220" y="182" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Domain &amp; Helpers (mod)</text>
        <text x="940" y="182" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">model.rs · studio.rs · browser.rs · devices.rs · theme.rs</text>

        <!-- L3 — Async Proxy Engine (FOCAL) -->
        <rect x="120" y="208" width="840" height="64" fill="rgba(191,69,32,0.08)"/>
        <rect x="120" y="208" width="840" height="64" fill="none" stroke="#bf4520" stroke-width="1"/>
        <text x="140" y="244" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">L3</text>
        <text x="220" y="246" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Async Gate &amp; TLS Core</text>
        <text x="940" y="246" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">proxy.rs (BindPolicy · Selective SSL · /__proxzy/* · SPKI CA)</text>

        <!-- L2 — CLI & External E2E SDK -->
        <rect x="120" y="272" width="840" height="64" fill="#ececec"/>
        <line x1="120" y1="336" x2="960" y2="336" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="140" y="308" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
        <text x="220" y="310" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Headless CLI &amp; TypeScript SDK</text>
        <text x="940" y="310" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">main.rs (--headless, --lan) · @proxzy/client</text>

        <!-- L1 — Verification & Clean Release Gate -->
        <rect x="120" y="336" width="840" height="64" fill="#ececec"/>
        <text x="140" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
        <text x="220" y="374" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Regression Gate &amp; Clean Release</text>
        <text x="940" y="374" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">scripts/regression-v1.sh · export-clean-release.sh · ci.yml</text>

        <!-- Caption -->
        <text x="120" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FORK RULE</text>
        <text x="220" y="456" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" font-style="italic">Never declare mod views; or mod rules_ui; in main.rs — UI files compile inside app.rs via include!(), while pure logic lives in L3–L4 mod files.</text>
      </svg>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProxzyCraft · Single-Port Security Boundary</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Step 1 of 3 · Architecture · Secure Paved Road</p>
    <h1>One port, three doors, and a TLS boundary</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="proxzy-arch-title proxzy-arch-desc">
        <title id="proxzy-arch-title">ProxzyCraft Single-Port Security Boundary</title>
        <desc id="proxzy-arch-desc">Client traffic enters the single-port listener and splits across the read-only CA portal, token-gated control plane, or selective TLS MITM and raw TCP passthrough.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (drawn before arrows and nodes) -->
        <rect x="240" y="64" width="440" height="428" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="256" y="68" width="164" height="12" rx="2" fill="#f5f5f5"/>
        <text x="338" y="77" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">LOCAL ENGINE BOUNDARY</text>

        <rect x="720" y="248" width="200" height="244" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="736" y="252" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="778" y="261" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">UPSTREAM</text>

        <!-- Arrows (drawn before nodes) -->
        <!-- Client -> Listener -->
        <line x1="200" y1="268" x2="264" y2="268" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Listener (x=264..424, y=236..300) fanned right edge ports: y=252, y=268, y=284 -->
        <!-- Port 1 (top): Listener -> CA Portal (y=124..188, cx=580) -->
        <path d="M 424,252 H 460 Q 468,252 468,244 V 164 Q 468,156 476,156 H 500"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Port 2 (mid): Listener -> Control Plane (y=236..300) -->
        <line x1="424" y1="268" x2="500" y2="268" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Port 3 (low): Listener -> Raw Tunnel (y=360..424) -->
        <path d="M 424,284 H 460 Q 468,284 468,292 V 384 Q 468,392 476,392 H 500"
              fill="none" stroke="#4f5d75" stroke-width="1.0" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Control Plane -> TLS MITM & MapRule? No: Listener also sends allowlisted HTTPS to MITM (bottom edge x=344, y=300) -->
        <!-- Let's route TLS MITM cleanly via Listener bottom edge to TLS MITM at (264, 384) -->
        <line x1="344" y1="300" x2="344" y2="376" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- Blocked bypass: TLS MITM right edge (x=424, y=408) stops before Control Plane -->
        <path d="M 424,408 H 444 Q 452,408 452,400 V 324"
              fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,3"/>
        <line x1="444" y1="316" x2="460" y2="332" stroke="#bf4520" stroke-width="1.4"/>
        <line x1="460" y1="316" x2="444" y2="332" stroke="#bf4520" stroke-width="1.4"/>

        <!-- Raw Tunnel -> Upstream Cloud -->
        <path d="M 660,392 H 712 Q 720,392 720,384 V 344 Q 720,336 728,336 H 740"
              fill="none" stroke="#4f5d75" stroke-width="1.0" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- TLS MITM (bottom y=440) -> Upstream API (at x=740, y=396..460) -->
        <path d="M 344,440 V 452 Q 344,460 352,460 H 692 Q 700,460 700,452 V 436 Q 700,428 708,428 H 740"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- Arrow Labels (opaque paper masks, 6-10px visible gap from strokes) -->
        <rect x="208" y="244" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="232" y="253" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PORT 9090</text>

        <rect x="444" y="136" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="470" y="145" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/CA.CER</text>

        <rect x="432" y="244" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="462" y="253" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/__PROXZY</text>

        <rect x="434" y="400" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="464" y="409" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASSTHRU</text>

        <rect x="272" y="330" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="304" y="339" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOWLIST</text>

        <rect x="476" y="318" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="528" y="327" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BLOCKED IN TLS</text>

        <rect x="528" y="468" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="576" y="477" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IF NO MAPRULE</text>

        <!-- Node 1: App / Runner -->
        <rect x="40" y="236" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="236" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="244" width="40" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.45)" stroke-width="0.8"/>
        <text x="68" y="253" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="120" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">App &amp; Runner</text>
        <text x="120" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">iOS · Android · CLI</text>

        <!-- Node 2: Single-Port Listener (Focal #1) -->
        <rect x="264" y="236" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="264" y="236" width="160" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="272" y="244" width="48" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="296" y="253" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATEWAY</text>
        <text x="344" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Listener Router</text>
        <text x="344" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BindPolicy :9090</text>

        <!-- Node 3: CA Portal -->
        <rect x="500" y="124" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="500" y="124" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="508" y="132" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="530" y="141" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PORTAL</text>
        <text x="580" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cert Portal</text>
        <text x="580" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GET only · CA only</text>

        <!-- Node 4: Control Plane (Focal #2, security boundary) -->
        <rect x="500" y="236" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="500" y="236" width="160" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,4"/>
        <rect x="508" y="244" width="52" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="534" y="253" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONTROL</text>
        <text x="580" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Control Plane</text>
        <text x="580" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">loopback or token</text>

        <!-- Node 5: Raw TCP Tunnel -->
        <rect x="500" y="360" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="500" y="360" width="160" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.28)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="508" y="368" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="530" y="377" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TUNNEL</text>
        <text x="580" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Raw TCP Splice</text>
        <text x="580" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Apple · OCSP · unlisted</text>

        <!-- Node 6: TLS MITM + MapRule -->
        <rect x="264" y="376" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="264" y="376" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="272" y="384" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="290" y="393" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MITM</text>
        <text x="344" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TLS &amp; MapRule</text>
        <text x="344" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rcgen · 3 scenarios</text>

        <!-- Node 7: Public / Protected Cloud -->
        <rect x="740" y="296" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="740" y="296" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="748" y="304" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="770" y="313" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIRECT</text>
        <text x="820" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Public TLS</text>
        <text x="820" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zero cert error</text>

        <!-- Node 8: Target Backend API -->
        <rect x="740" y="392" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="740" y="392" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="748" y="400" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="770" y="409" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TARGET</text>
        <text x="820" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Staging API</text>
        <text x="820" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SSRF peer-guarded</text>

        <!-- Legend strip (horizontal at bottom) -->
        <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="40" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="548" width="16" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="64" y="558" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Focal router &amp; control boundary</text>

        <rect x="272" y="548" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="296" y="558" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Local service / MITM</text>

        <line x1="448" y1="554" x2="480" y2="554" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="488" y="558" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Allowlisted HTTPS</text>

        <line x1="628" y1="554" x2="660" y2="554" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="668" y="558" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Blind passthrough</text>

        <line x1="796" y1="554" x2="824" y2="554" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,3"/>
        <text x="832" y="558" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Blocked in TLS</text>
      </svg>
    </div>
  </div>
</body>
</html>

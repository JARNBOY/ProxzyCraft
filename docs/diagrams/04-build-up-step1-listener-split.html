<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProxzyCraft · Step 1: Safe Listener &amp; Selective TLS Split</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Build-Up 1 of 3 · Architecture · Safe Paved Road</p>
    <h1>Step 1: One listener port, Isolated Browser, and zero blind MITM</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="proxzy-b1-title proxzy-b1-desc">
        <title id="proxzy-b1-title">ProxzyCraft Safe Entry and Selective TLS Split</title>
        <desc id="proxzy-b1-desc">Isolated Browser Sessions and mobile clients connect to the single-port listener, routing to read-only CA portals, blind TCP passthrough, or allowlist-only TLS inspection.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (drawn before arrows and nodes) -->
        <rect x="260" y="60" width="420" height="396" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="276" y="64" width="168" height="12" rx="2" fill="#f5f5f5"/>
        <text x="360" y="73" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">PROXY BOUNDARY (:9090)</text>

        <rect x="724" y="196" width="196" height="260" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="740" y="200" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="790" y="209" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">UPSTREAM NET</text>

        <!-- Arrows (drawn before nodes) -->
        <!-- Isolated Browser (x=40..208, y=176..244) -> Listener (x=284..444, y=224..292) -->
        <path d="M 208,212 H 240 Q 248,212 248,220 V 236 Q 248,244 256,244 H 284"
              fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Mobile Simulator / Device (x=40..208, y=288..356) -> Listener -->
        <path d="M 208,320 H 240 Q 248,320 248,312 V 280 Q 248,272 256,272 H 284"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Listener right edge (x=444) fanned ports: y=240, y=258, y=276 -->
        <!-- Port 1: Listener -> Cert Portal (x=504..664, y=104..168, cy=136) -->
        <path d="M 444,240 H 468 Q 476,240 476,232 V 144 Q 476,136 484,136 H 504"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Port 2: Listener -> Selective TLS MITM (x=504..664, y=224..292, cy=258) -->
        <line x1="444" y1="258" x2="504" y2="258" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>

        <!-- Port 3: Listener -> Raw TCP Splice (x=504..664, y=356..424, cy=390) -->
        <path d="M 444,276 H 468 Q 476,276 476,284 V 382 Q 476,390 484,390 H 504"
              fill="none" stroke="#4f5d75" stroke-width="1.0" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Selective MITM -> Target Backend API (x=744..900, y=224..292) -->
        <line x1="664" y1="258" x2="744" y2="258" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- Raw TCP Splice -> Public / OS Cloud (x=744..900, y=356..424) -->
        <line x1="664" y1="390" x2="744" y2="390" stroke="#4f5d75" stroke-width="1.0" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Arrow Labels (masked on #f5f5f5 with 6-10px gap from stroke) -->
        <rect x="208" y="188" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="236" y="197" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPKI FLAG</text>

        <rect x="216" y="332" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="238" y="341" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIM / ADB</text>

        <rect x="448" y="114" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="476" y="123" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">.INTERNAL</text>

        <rect x="448" y="234" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="474" y="243" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOWLIST</text>

        <rect x="448" y="366" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="474" y="375" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNLISTED</text>

        <rect x="676" y="234" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="704" y="243" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANTI-SSRF</text>

        <rect x="676" y="366" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="704" y="375" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DIRECT IO</text>

        <!-- Node 1: Isolated Browser Session -->
        <rect x="40" y="176" width="168" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="176" width="168" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="48" y="184" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="76" y="193" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BROWSER.RS</text>
        <text x="124" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Isolated Browser</text>
        <text x="124" y="230" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no OS proxy mutation</text>

        <!-- Node 2: Mobile Sim / Physical Device -->
        <rect x="40" y="288" width="168" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="288" width="168" height="68" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="296" width="56" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.45)" stroke-width="0.8"/>
        <text x="76" y="305" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEVICES.RS</text>
        <text x="124" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mobile &amp; Runners</text>
        <text x="124" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">simctl · adb · Playwright</text>

        <!-- Node 3: Single-Port Listener (Focal) -->
        <rect x="284" y="224" width="160" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="284" y="224" width="160" height="68" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="292" y="232" width="52" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="318" y="241" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROXY.RS</text>
        <text x="364" y="262" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BindPolicy Gate</text>
        <text x="364" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LoopbackOnly :9090</text>

        <!-- Node 4: Read-Only Cert Portal -->
        <rect x="504" y="104" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="504" y="104" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="512" y="112" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="534" y="121" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PORTAL</text>
        <text x="584" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cert Portal</text>
        <text x="584" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proxzy.internal / .local</text>

        <!-- Node 5: Selective TLS MITM -->
        <rect x="504" y="224" width="160" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="504" y="224" width="160" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="512" y="232" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="530" y="241" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MITM</text>
        <text x="584" y="262" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Selective TLS</text>
        <text x="584" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rcgen leaf · 0600 key</text>

        <!-- Node 6: Raw TCP Splice -->
        <rect x="504" y="356" width="160" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="504" y="356" width="160" height="68" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.28)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="512" y="364" width="48" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="536" y="373" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TUNNEL</text>
        <text x="584" y="394" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Blind Splice</text>
        <text x="584" y="410" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Apple · OCSP · unlisted</text>

        <!-- Node 7: Target Backend API -->
        <rect x="744" y="224" width="156" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="744" y="224" width="156" height="68" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="752" y="232" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="774" y="241" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TARGET</text>
        <text x="822" y="262" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Staging API</text>
        <text x="822" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">resolve_upstream()</text>

        <!-- Node 8: Public Web / OS Services -->
        <rect x="744" y="356" width="156" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="744" y="356" width="156" height="68" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="752" y="364" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="774" y="373" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIRECT</text>
        <text x="822" y="394" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Public TLS</text>
        <text x="822" y="410" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">never decrypted</text>

        <!-- Legend strip (horizontal at bottom) -->
        <line x1="40" y1="484" x2="920" y2="484" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="40" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="520" width="16" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="64" y="530" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Focal safety listener</text>

        <rect x="240" y="520" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="264" y="530" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Scoped client / MITM node</text>

        <line x1="452" y1="526" x2="484" y2="526" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <text x="492" y="530" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Allowlisted HTTPS only</text>

        <line x1="656" y1="526" x2="688" y2="526" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="696" y="530" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Blind passthrough (default)</text>
      </svg>
    </div>
  </div>
</body>
</html>

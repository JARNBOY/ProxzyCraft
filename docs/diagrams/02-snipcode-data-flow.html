<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProxzyCraft · How studio.rs Generates snipCode</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
      --soft: #5a6580; --rule: rgba(45,49,66,0.12); --accent: #bf4520;
      --accent-tint: rgba(191,69,32,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 616px; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
    .step-number, .step-label, .lane-label, .role-text, .chip-text, .legend-label { font-family: var(--mono); text-anchor: middle; }
    .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; }
    .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
    .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
    .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; }
    .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
    .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
    .chip-text { fill: #fff; font-size: 5px; font-weight: 700; }
    .focal-text { fill: var(--accent); }
    .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
    .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Step 2 of 3 · Data Flow · studio.rs &amp; studio_ui.rs</p>
    <h1>How target state becomes runnable snipCode</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 616 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="snipcode-flow-title snipcode-flow-desc">
        <title id="snipcode-flow-title">How studio.rs generates target-aware snipCode</title>
        <desc id="snipcode-flow-desc">Target selection resolves host, bridge, and control token before studio.rs renders Env, Playwright, MCP, XCTest, Espresso, and cURL snippets for runners.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
          <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#bf4520"/></marker>
          <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="616" height="356" fill="#f5f5f5"/>
        <rect width="616" height="356" fill="url(#dots)"/>
        <rect x="0" y="36" width="616" height="80" fill="rgba(45,49,66,0.018)"/>
        <rect x="0" y="196" width="616" height="80" fill="rgba(45,49,66,0.018)"/>

        <!-- Header and lane dividers -->
        <line x1="0" y1="36" x2="616" y2="36" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="116" x2="616" y2="116" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="196" x2="616" y2="196" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="276" x2="616" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="140" y1="36" x2="140" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

        <!-- Step Header Chips -->
        <g aria-label="Pipeline steps">
          <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">TARGET</text>
          <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">RESOLVE</text>
          <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(191,69,32,0.20)"/><text x="420" y="14" class="step-number focal-text">03</text><text x="420" y="29" class="step-label focal-text">GENERATE</text>
          <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">EXECUTE</text>
        </g>

        <!-- Lane Labels -->
        <g aria-label="Role lanes">
          <text x="70" y="72" class="lane-label">TARGET</text><text x="70" y="84" class="lane-label">CONFIG</text>
          <text x="70" y="152" class="lane-label">STUDIO</text><text x="70" y="164" class="lane-label">SNIPCODE</text>
          <text x="70" y="232" class="lane-label">TEST</text><text x="70" y="244" class="lane-label">RUNNER</text>
        </g>

        <!-- Connectors (drawn before nodes) -->
        <path d="M246 76 H258" fill="none" stroke="#4f5d75" stroke-width="1.0" marker-end="url(#arr-muted)"/>
        <path d="M358 76 H412 Q420 76 420 84 V124" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arr-accent)"/>
        <path d="M470 156 H482" fill="none" stroke="#4f5d75" stroke-width="1.0" marker-end="url(#arr-muted)"/>
        <path d="M420 188 V228 Q420 236 428 236 H482" fill="none" stroke="#2e5aa8" stroke-width="1.0" marker-end="url(#arr-link)"/>

        <!-- Focal arrow label mask (6px+ above line) -->
        <rect x="364" y="56" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="390" y="65" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOST+TOK</text>

        <!-- Node (CFG, 0): Pick Target -->
        <rect x="146" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
        <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="159" y="53" class="role-text">CFG</text>
        <text x="196" y="67" class="node-title">Pick Target</text><text x="196" y="79" class="node-sub">Mac · iOS · Android</text><text x="196" y="91" class="node-tool">TargetPlatform</text>
        <rect x="226" y="98" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="234" y="104" class="chip-text">LS</text>

        <!-- Node (CFG, 1): Resolve Policy -->
        <rect x="258" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
        <rect x="262" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="271" y="53" class="role-text">CFG</text>
        <text x="308" y="67" class="node-title">Resolve Link</text><text x="308" y="79" class="node-sub">127.0.0.1 vs LAN</text><text x="308" y="91" class="node-tool">host_for_target</text>
        <rect x="262" y="98" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="270" y="104" class="chip-text">LS</text>
        <rect x="338" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="346" y="104" class="chip-text">DB</text>

        <!-- Node (STD, 2): Render snipCode (FOCAL) -->
        <rect x="370" y="124" width="100" height="64" rx="6" fill="rgba(191,69,32,0.07)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="374" y="128" width="18" height="10" rx="3" fill="rgba(191,69,32,0.20)"/><text x="383" y="133" class="role-text focal-text">STD</text>
        <text x="420" y="147" class="node-title">Render snipCode</text><text x="420" y="159" class="node-sub">Env·XCTest·cURL</text><text x="420" y="171" class="node-tool">studio.rs:812</text>
        <rect x="374" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="382" y="184" class="chip-text">DB</text>
        <rect x="450" y="178" width="16" height="8" rx="3" fill="#9c6b50"/><text x="458" y="184" class="chip-text">FL</text>

        <!-- Node (STD, 3): Export WireMock -->
        <rect x="482" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
        <rect x="486" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="495" y="133" class="role-text">STD</text>
        <text x="532" y="147" class="node-title">WireMock JSON</text><text x="532" y="159" class="node-sub">rules → mappings</text><text x="532" y="171" class="node-tool">wiremock_mappings</text>
        <rect x="486" y="178" width="16" height="8" rx="3" fill="#9c6b50"/><text x="494" y="184" class="chip-text">FL</text>

        <!-- Node (RUN, 3): Run Harness & Agent -->
        <rect x="482" y="204" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
        <rect x="486" y="208" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="495" y="213" class="role-text">RUN</text>
        <text x="532" y="227" class="node-title">Drive E2E Test</text><text x="532" y="239" class="node-sub">Playwright · MCP</text><text x="532" y="251" class="node-tool">/__proxzy/*</text>
        <rect x="486" y="258" width="16" height="8" rx="3" fill="#9c6b50"/><text x="494" y="264" class="chip-text">FL</text>
        <rect x="562" y="258" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="570" y="264" class="chip-text">LS</text>

        <!-- Legend: 3 rows -->
        <text x="132" y="295" class="legend-label">STEPS</text>
        <rect x="148" y="285" width="22" height="14" rx="7" fill="rgba(45,49,66,0.12)"/><text x="159" y="294" class="step-number">01</text><text x="176" y="295" class="legend-text">Target</text>
        <rect x="228" y="285" width="22" height="14" rx="7" fill="rgba(45,49,66,0.12)"/><text x="239" y="294" class="step-number">02</text><text x="256" y="295" class="legend-text">Resolve</text>
        <rect x="312" y="285" width="22" height="14" rx="7" fill="rgba(191,69,32,0.20)"/><text x="323" y="294" class="step-number focal-text">03</text><text x="340" y="295" class="legend-text focal-text">Generate</text>
        <rect x="400" y="285" width="22" height="14" rx="7" fill="rgba(45,49,66,0.12)"/><text x="411" y="294" class="step-number">04</text><text x="428" y="295" class="legend-text">Execute</text>

        <text x="132" y="316" class="legend-label">DATA TYPE</text>
        <rect x="148" y="308" width="18" height="10" rx="3" fill="#7c8f6f"/><text x="157" y="315" class="chip-text">LS</text><text x="172" y="316" class="legend-text">Live state</text>
        <rect x="236" y="308" width="18" height="10" rx="3" fill="#5e7a9b"/><text x="245" y="315" class="chip-text">DB</text><text x="260" y="316" class="legend-text">Resolved config</text>
        <rect x="348" y="308" width="18" height="10" rx="3" fill="#9c6b50"/><text x="357" y="315" class="chip-text">FL</text><text x="372" y="316" class="legend-text">Snippet text</text>
        <text x="448" y="316" class="node-sub" style="text-anchor:start">left chip = input · right chip = output</text>

        <text x="132" y="338" class="legend-label">FLOW</text>
        <line x1="148" y1="335" x2="176" y2="335" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr-muted)"/><text x="184" y="338" class="legend-text">Config / export</text>
        <line x1="276" y1="335" x2="304" y2="335" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arr-accent)"/><text x="312" y="338" class="legend-text">Focal handoff</text>
        <line x1="396" y1="335" x2="424" y2="335" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arr-link)"/><text x="432" y="338" class="legend-text">Published to test runner</text>
      </svg>
    </div>
  </main>
</body>
</html>
